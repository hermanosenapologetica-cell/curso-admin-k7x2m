*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}

main{max-width:680px;margin:0 auto;padding:0 14px 72px}
body.lock main{display:none}
#gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
body.lock #gate{display:flex}
#gate form{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:24px;max-width:340px;width:100%;box-shadow:var(--sh);text-align:center}

#gate p{color:var(--mu);margin:0 0 14px;font-size:.95rem}
input{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font-size:1rem}
.b{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:0;border-radius:8px;background:var(--ac);color:var(--ai);font-size:1rem;cursor:pointer;text-decoration:none}
.b.s{background:var(--ch);color:var(--ink);border:1px solid var(--ln)}
#gate .b{width:100%;margin-top:10px}
#err{color:var(--ac);min-height:1.4em;font-size:.9rem;margin-top:8px}
header{text-align:center;padding:26px 0 8px}
header h1{font-size:1.7rem}
header p{color:var(--mu);margin:6px 0 0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px 16px 20px;margin:16px 0;box-shadow:var(--sh)}
.num{color:var(--ac);font-weight:600;letter-spacing:.02em}
.card h2{font-size:1.6rem;text-align:center;margin:6px 0 4px}
.txt{white-space:pre-line;background:var(--ch);border-radius:10px;padding:12px 14px;margin:12px 0;overflow-wrap:break-word}
.nt{color:var(--mu);font-style:italic;margin:10px 0}
img{display:block;max-width:100%;height:auto;border-radius:10px;margin:12px auto}
img.st{max-width:160px}
video.tg{max-width:220px;aspect-ratio:auto;max-height:none;margin:10px auto 6px}
video{display:block;width:100%;aspect-ratio:4/3;max-height:75vh;object-fit:contain;background:#000;border-radius:10px;margin:12px auto}
.au{display:flex;align-items:center;gap:8px;background:var(--ch);border-radius:999px;padding:6px 12px;margin:12px 0}
.au audio{flex:1;width:100%;height:40px}
.doc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:12px 0}
.doc span{font-size:.92rem;overflow-wrap:anywhere;flex:1 1 180px}
.doc div{display:flex;gap:8px}
#idx{list-style:none;margin:10px 0 0;padding:0}
#idx a{display:block;padding:7px 4px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ln)}
#idx a b{color:var(--ac);margin-right:6px}
.ct h3{font-size:1.05rem;margin:14px 0 4px}
.ct a{color:var(--ac)}
.ct p{margin:2px 0}
html{scroll-padding-top:66px}
#bar{position:sticky;top:0;z-index:20;display:flex;gap:8px;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--ln)}
#bar a,#bar button{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 8px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font-size:.95rem;font-weight:600;text-decoration:none;cursor:pointer}
#bar .p{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd a{color:var(--ac);font-size:.9rem;text-decoration:none;padding:6px 0 6px 10px}

#grid.on{display:flex}
body.lock #grid{display:none}

function goTo(id){
 if(id==='top'){window.scrollTo({top:0,behavior:'instant'});return}
 var el=document.getElementById(id);if(!el)return;
 var stop=false,t0=Date.now(),last=t0;
 function cancel(){stop=true}
 ['touchstart','wheel','keydown','mousedown'].forEach(function(ev){window.addEventListener(ev,cancel,{once:true,passive:true})});
 (function step(){
  if(stop)return;
  var o=el.getBoundingClientRect().top-66;
  if(Math.abs(o)>2){window.scrollBy({top:o,behavior:'instant'});last=Date.now()}
  if(Date.now()-last<900&&Date.now()-t0<10000)requestAnimationFrame(step);
 })();
}

 var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;
